name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # manuel kørsel: scanner hele historikken
  schedule:
    - cron: '17 5 * * 1' # hver mandag: fanger nye sårbarheder uden kodeændringer

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fejler ved kendte sårbarheder i de pakker, der leveres med appen.
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
