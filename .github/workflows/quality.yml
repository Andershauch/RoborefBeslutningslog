name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Tests, types, lint, and local build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests with coverage thresholds
        run: npm run test:coverage
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check ESLint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Rebuild offline local client
        run: npm run build:local-client
      - name: Check that the committed client is up to date
        # public/client.js og app.css er genereret. Hvis de afviger fra kildekoden,
        # er klienten forældet: kør `npm run build:local-client` og commit resultatet.
        run: git diff --exit-code -- public/client.js public/app.css public/THIRD-PARTY-LICENSES.txt

  cross-platform:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check formatting (line endings must be the same on every system)
        run: npm run format:check
